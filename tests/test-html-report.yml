name: Test HTML report generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gcovr
        run: pip install gcovr
      - id: action
        uses: .
        with:
          fail-under-line: 0
          html-out: coverage.html
          html-title: "Test Coverage Report"
      - name: Assert HTML report was created
        run: |
          echo "Checking for HTML report at coverage.html"
          if [ ! -f "coverage.html" ]; then
            echo "FAIL: coverage.html was not created"
            exit 1
          fi
          echo "PASS: coverage.html exists"
