name: Test coveralls-repo-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install g++ with coverage support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ gcovr

      - name: Create and compile C++ source with coverage
        run: |
          mkdir -p /tmp/cpp-project-token
          printf '#include <iostream>\nint main() {\n  std::cout << "hello" << std::endl;\n  return 0;\n}\n' > /tmp/cpp-project-token/main.cpp
          cd /tmp/cpp-project-token
          g++ --coverage -fprofile-arcs -ftest-coverage -o main main.cpp
          ./main

      - name: Run gcovr action with coveralls-repo-token and coveralls-out
        id: gcovr
        uses: .
        with:
          root: /tmp/cpp-project-token
          coveralls-out: /tmp/coveralls-token-test.json
          coveralls-repo-token: fake-token-for-testing

      - name: Assert coveralls output file was generated
        run: |
          echo "Checking coveralls output file..."
          if [ ! -f /tmp/coveralls-token-test.json ]; then
            echo "FAIL: coveralls output file not found at /tmp/coveralls-token-test.json"
            exit 1
          fi
          echo "PASS: coveralls output file exists"
