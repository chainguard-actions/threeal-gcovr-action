name: Test Basic Usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies and gcovr
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc python3-pip
          # Install gcovr system-wide so it's available in PATH
          sudo pip3 install gcovr --break-system-packages 2>/dev/null || \
            sudo pip3 install gcovr 2>/dev/null || \
            pip3 install --user gcovr --break-system-packages 2>/dev/null || \
            pip3 install --user gcovr
          # Ensure user local bin is in PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compile C program with coverage flags
        run: |
          mkdir -p $GITHUB_WORKSPACE/cov-basic
          cp tests/fixtures/src/main.c $GITHUB_WORKSPACE/cov-basic/main.c
          cd $GITHUB_WORKSPACE/cov-basic
          gcc -fprofile-arcs -ftest-coverage -O0 -o main main.c
          ./main

      - name: Verify gcovr is available
        run: |
          which gcovr || (echo "gcovr not found in PATH" && exit 1)
          gcovr --version

      - name: Run gcovr action (basic - print coverage to log)
        id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/cov-basic

      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully (gcovr ran without error)"
          echo "PASS"
