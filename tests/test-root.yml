name: Test Root Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies and gcovr
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc python3-pip
          sudo pip3 install gcovr --break-system-packages 2>/dev/null || \
            sudo pip3 install gcovr 2>/dev/null || \
            pip3 install --user gcovr --break-system-packages 2>/dev/null || \
            pip3 install --user gcovr
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compile C program with coverage flags
        run: |
          mkdir -p $GITHUB_WORKSPACE/cov-root/src
          mkdir -p $GITHUB_WORKSPACE/cov-root/build
          cp tests/fixtures/src/main.c $GITHUB_WORKSPACE/cov-root/src/main.c
          cd $GITHUB_WORKSPACE/cov-root/build
          gcc -fprofile-arcs -ftest-coverage -O0 -o main ../src/main.c
          ./main

      - name: Verify gcovr is available
        run: |
          which gcovr || (echo "gcovr not found in PATH" && exit 1)
          gcovr --version

      - name: Run gcovr action with root input pointing to source directory
        id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/cov-root/build
          root: ${{ github.workspace }}/cov-root/src

      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully with root input"
          echo "PASS"
