name: Test root input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a minimal C++ project with coverage data
        run: |
          mkdir -p myproject/src myproject/build
          cat > myproject/src/main.cpp << 'EOF'
          #include <iostream>
          int add(int a, int b) { return a + b; }
          int main() {
            std::cout << add(1, 2) << std::endl;
            return 0;
          }
          EOF
          cd myproject/build
          g++ --coverage -o main ../src/main.cpp
          ./main

      - name: Run gcovr action with root input
        id: action
        uses: .
        with:
          root: myproject/src

      - name: Assert action succeeded with root input
        run: |
          echo "PASS: gcovr action completed with root input"
