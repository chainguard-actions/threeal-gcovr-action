name: Test Cobertura XML report generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ python3-pip pipx
          pipx install gcovr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and run sample project with coverage
        run: |
          mkdir -p /tmp/build
          cmake -S "$GITHUB_WORKSPACE/sample" \
                -B /tmp/build
          cmake --build /tmp/build
          cd /tmp/build && ctest --output-on-failure

      - id: action
        uses: .
        with:
          working-directory: /tmp/build
          cobertura-out: /tmp/coverage.xml
          cobertura-pretty: true
          print-summary: true

      - name: Assert Cobertura XML report was generated
        run: |
          echo "Checking for Cobertura XML report at /tmp/coverage.xml"
          if [ ! -f /tmp/coverage.xml ]; then
            echo "FAIL: Cobertura XML report was not generated"
            exit 1
          fi
          echo "XML report size: $(wc -c < /tmp/coverage.xml) bytes"
          if ! grep -q "<coverage" /tmp/coverage.xml; then
            echo "FAIL: XML report does not contain expected <coverage> element"
            exit 1
          fi
          echo "PASS"
