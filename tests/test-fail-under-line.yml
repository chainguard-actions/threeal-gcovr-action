name: Test fail-under-line threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ python3-pip pipx
          pipx install gcovr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build sample project with coverage (do not run tests)
        run: |
          mkdir -p /tmp/build
          cmake -S "$GITHUB_WORKSPACE/sample" \
                -B /tmp/build
          cmake --build /tmp/build
          # Do NOT run the binary - coverage will be 0%

      - name: Run gcovr with zero threshold (should pass)
        id: action-pass
        uses: .
        with:
          working-directory: /tmp/build
          fail-under-line: 0
          print-summary: true

      - name: Assert zero threshold passed
        run: |
          echo "gcovr with zero threshold completed successfully"
          echo "PASS"

      - name: Run gcovr with non-zero threshold (should fail since coverage is 0%)
        id: action-fail
        uses: .
        with:
          working-directory: /tmp/build
          fail-under-line: 50
          print-summary: true
        continue-on-error: true

      - name: Assert high threshold caused failure
        env:
          OUTCOME: ${{ steps.action-fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with 50% line coverage threshold when coverage is 0% but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when coverage was below threshold"
