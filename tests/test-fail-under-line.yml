name: Test fail-under-line input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install g++ with coverage support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ gcovr

      - name: Create C++ source file with partial coverage and compile
        run: |
          mkdir -p /tmp/cpp-project
          printf '#include <iostream>\nint covered() { return 42; }\nint uncovered() { return 0; }\nint main() {\n  std::cout << covered() << std::endl;\n  return 0;\n}\n' > /tmp/cpp-project/main.cpp
          cd /tmp/cpp-project
          g++ --coverage -fprofile-arcs -ftest-coverage -o main main.cpp
          ./main

      - name: Run gcovr action with low fail-under-line threshold (should pass)
        id: gcovr-pass
        uses: .
        with:
          root: /tmp/cpp-project
          fail-under-line: 1

      - name: Assert gcovr passed with low threshold
        run: |
          echo "gcovr action passed with low threshold"
          echo "PASS"

      - name: Run gcovr action with 100% fail-under-line threshold (should fail)
        id: gcovr-fail
        uses: .
        with:
          root: /tmp/cpp-project
          fail-under-line: 100
        continue-on-error: true

      - name: Assert gcovr failed with 100% threshold
        env:
          OUTCOME: ${{ steps.gcovr-fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected gcovr to fail with 100% line coverage threshold but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: gcovr correctly failed when coverage was below 100%"
