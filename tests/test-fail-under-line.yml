name: Test fail-under-line threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gcovr
        run: pip install gcovr
      - id: action
        uses: .
        with:
          fail-under-line: 100
        continue-on-error: true
      - name: Assert action failed due to low coverage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when coverage is below 100%, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when line coverage was below 100%"
