name: Test coveralls-out input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gcovr
        run: pip install gcovr
      - id: action
        uses: .
        with:
          coveralls-out: coveralls.json
          fail-under-line: 0
          fail-under-branch: 0
          fail-under-function: 0
      - name: Assert coveralls report was created
        run: |
          echo "Checking for Coveralls report at coveralls.json"
          if [ ! -f "coveralls.json" ]; then
            echo "FAIL: coveralls.json was not created"
            exit 1
          fi
          echo "PASS: coveralls.json exists"
