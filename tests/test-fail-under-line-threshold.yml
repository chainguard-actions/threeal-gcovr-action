name: Test fail-under-line threshold failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a minimal C++ project with partial coverage
        run: |
          mkdir -p src build
          # Create a file with uncovered branches to ensure < 100% line coverage
          cat > src/main.cpp << 'EOF'
          #include <iostream>
          int add(int a, int b) { return a + b; }
          int subtract(int a, int b) { return a - b; }
          int main() {
            std::cout << add(1, 2) << std::endl;
            // subtract is never called, so coverage < 100%
            return 0;
          }
          EOF
          cd build
          g++ --coverage -o main ../src/main.cpp
          ./main

      - name: Run gcovr action with very high fail-under-line (should fail)
        id: action
        uses: .
        with:
          fail-under-line: 100
        continue-on-error: true

      - name: Assert action failed due to low coverage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail-under-line=100 but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when coverage was below threshold"
