name: Gcovr Action
description: Generate code coverage reports for a C++ project using gcovr
author: Alfi Maulana
branding:
  color: green
  icon: check-circle
inputs:
  root:
    description: Root directory of your source files
    required: false
  gcov-executable:
    description: Use a particular gcov executable
    required: false
  exclude:
    description: Exclude source files that match this filter
    required: false
  fail-under-line:
    description: Fail if the total line coverage is less than this value
    required: false
  coveralls-out:
    description: Output file of the generated Coveralls API coverage report
    required: false
  coveralls-send:
    description: Send the generated Coveralls API coverage report to it's endpoint (true/false)
    required: false
    default: false
  github-token:
    description: GitHub token of your project
    required: false
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Check if gcovr is installed
      shell: bash
      run: |
        if ! command -v gcovr &> /dev/null; then
          echo "gcovr could not be found, installing..."
          pip3 install gcovr
        fi
    - name: Process inputs
      shell: bash
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_GCOV_EXECUTABLE: ${{ inputs.gcov-executable }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FAIL_UNDER_LINE: ${{ inputs.fail-under-line }}
        INPUT_COVERALLS_OUT: ${{ inputs.coveralls-out }}
        INPUT_COVERALLS_SEND: ${{ inputs.coveralls-send }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        COVERALLS_OUT=""

        if [ -n "$INPUT_COVERALLS_OUT" ]; then
          COVERALLS_OUT="$INPUT_COVERALLS_OUT"
        elif [ "$INPUT_COVERALLS_SEND" = "true" ]; then
          COVERALLS_OUT="/tmp/coveralls.json"
        fi

        safe_coveralls_out=$(printf '%s' "$COVERALLS_OUT" | tr -d '\n\r')

        echo "COVERALLS_OUT=$safe_coveralls_out" >> "$GITHUB_ENV"
    - name: Check if LLVM coverage is installed
      if: contains(inputs.gcov-executable, 'llvm-cov')
      shell: bash
      run: |
        if ! command -v llvm-cov &> /dev/null; then
          echo "llvm-cov could not be found, installing..."
          case "$OSTYPE" in
            darwin*)  brew install llvm ;;
            linux*)   sudo apt-get install -y llvm ;;
            *)        choco install -y llvm ;;
          esac
        fi
    - name: Generate code coverage report using gcovr
      shell: bash
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_GCOV_EXECUTABLE: ${{ inputs.gcov-executable }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FAIL_UNDER_LINE: ${{ inputs.fail-under-line }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        COVERALLS_OUT: ${{ env.COVERALLS_OUT }}
      run: |
        gcovr_args=()
        if [ -n "$INPUT_ROOT" ]; then
          gcovr_args+=(--root "$INPUT_ROOT")
        fi
        if [ -n "$INPUT_GCOV_EXECUTABLE" ]; then
          gcovr_args+=(--gcov-executable "$INPUT_GCOV_EXECUTABLE")
        fi
        if [ -n "$INPUT_EXCLUDE" ]; then
          gcovr_args+=(--exclude "$INPUT_EXCLUDE")
        fi
        if [ -n "$INPUT_FAIL_UNDER_LINE" ]; then
          gcovr_args+=(--fail-under-line "$INPUT_FAIL_UNDER_LINE")
        fi
        if [ -n "$COVERALLS_OUT" ]; then
          gcovr_args+=(--coveralls "$COVERALLS_OUT")
        fi

        if [ -n "$INPUT_GITHUB_TOKEN" ]; then
          COVERALLS_REPO_TOKEN="$INPUT_GITHUB_TOKEN" gcovr "${gcovr_args[@]}"
        else
          gcovr "${gcovr_args[@]}"
        fi

        if [ -e "$COVERALLS_OUT" ]; then
          # TODO: patch wrong service name generated by gcovr
          sed -i'' -e 's/"service_name": "github-actions-ci"/"service_name": "github"/' "$COVERALLS_OUT"
        fi
    - name: Send code coverage report to Coveralls
      if: ${{ inputs.coveralls-send == 'true' }}
      shell: bash
      env:
        COVERALLS_OUT: ${{ env.COVERALLS_OUT }}
      run: curl -v -F "json_file=@$COVERALLS_OUT" https://coveralls.io/api/v1/jobs
